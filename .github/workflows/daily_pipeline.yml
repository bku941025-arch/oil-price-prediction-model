name: Daily Gas Price Pipeline

on:
  schedule:
    - cron: '0 13 * * *'   # Every day at 8:00 AM EST (13:00 UTC)
  workflow_dispatch:        # Allow manual trigger from GitHub UI
    inputs:
      force_publish:
        description: 'Publish even if the accuracy gate fails'
        type: boolean
        default: false

permissions:
  contents: write           # Push updated forecasts back to the repo
  pages: write              # Deploy the site to GitHub Pages
  id-token: write

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        # Fails (and publishes nothing) if data is stale or accuracy drops sharply
        env:
          FORCE_PUBLISH: ${{ inputs.force_publish && '1' || '' }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          MASTODON_URL: ${{ secrets.MASTODON_URL }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL }}
          MODEL_VERSION: ${{ github.sha }}
        run: python pipeline.py

      - name: Commit and push updated files
        # With PUBLISH_BRANCH set, generated site files go to that branch instead of main,
        # so main only receives the small prediction/signal logs.
        env:
          PUBLISH_BRANCH: ${{ vars.PUBLISH_BRANCH }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Data/predictions Data/signals.csv Data/metrics.json
          if [ -z "$PUBLISH_BRANCH" ]; then git add site/data site/feeds; fi
          git diff --staged --quiet || git commit -m "Auto-update: $(date +'%Y-%m-%d') pipeline run"
          git push

      - name: Publish site to its own branch
        if: vars.PUBLISH_BRANCH != ''
        env:
          PUBLISH_BRANCH: ${{ vars.PUBLISH_BRANCH }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A single-commit branch, overwritten daily: deployable as is (Render or any static host)
          out=$(mktemp -d)
          cp -r site webapp requirements.txt "$out/"
          cd "$out"
          git init -q -b "$PUBLISH_BRANCH"
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" \
              commit -qm "Site build $(date +'%Y-%m-%d') from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$PUBLISH_BRANCH"

      - name: Upload site for GitHub Pages
        if: vars.DEPLOY_PAGES == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-pages:
    needs: run-pipeline
    if: vars.DEPLOY_PAGES == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
