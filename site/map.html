<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-en="Price Map — GasPrix MTL" data-fr="Carte des prix — GasPrix MTL">Price Map — GasPrix MTL</title>
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#2c5f8a">
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="assets/style.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="assets/app.js"></script>
</head>
<body>
<main class="main-content" style="max-width: 1200px;">
    <div class="page-header">
        <h1 class="page-title" data-en="Gas Prices Across Canada" data-fr="Prix de l'essence au Canada"></h1>
        <p class="page-subtitle" id="subtitle"></p>
    </div>

    <div class="card">
        <div class="card-header card-header-row">
            <div class="seg" id="mode">
                <button type="button" data-m="price" class="active" data-en="Today's price" data-fr="Prix actuel"></button>
                <button type="button" data-m="change" data-en="Expected 7-day move" data-fr="Variation prévue sur 7 jours"></button>
            </div>
            <span class="muted" id="count"></span>
        </div>
        <div id="map"></div>
        <div class="map-legend" id="legend"></div>
    </div>

    <div class="card">
        <div class="card-header">
            <h2 class="card-title" data-en="All cities" data-fr="Toutes les villes"></h2>
        </div>
        <div class="table-wrapper"><table class="compact-table" id="table"></table></div>
    </div>
</main>

<script>
(async () => {
    let index;
    try {
        ({ index } = await loadPage({ cityData: false }));
    } catch (e) {
        return showError(document.getElementById('map'), e);
    }
    const cities = index.cities;
    document.getElementById('subtitle').textContent = tr(
        `Regular gasoline, ¢/L with taxes. Average across ${cities.length} cities: ${index.national_avg.toFixed(1)} ¢/L.`,
        `Essence ordinaire, ¢/L taxes incluses. Moyenne de ${cities.length} villes : ${index.national_avg.toFixed(1)} ¢/L.`);

    const prices = cities.map(c => c.today_price).sort((a, b) => a - b);
    const q = p => prices[Math.floor(p * (prices.length - 1))];
    const priceColor = v => v <= q(0.2) ? '#2a8a5a' : v <= q(0.4) ? '#6aaa64' : v <= q(0.6) ? '#a8a8a8' : v <= q(0.8) ? '#e0a040' : '#d0603a';
    const changeColor = v => v <= -2 ? '#2a8a5a' : v < -0.5 ? '#6aaa64' : v <= 0.5 ? '#a8a8a8' : v < 2 ? '#e0a040' : '#d0603a';

    const map = L.map('map', { scrollWheelZoom: false }).setView([52, -92], 4);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 12, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
    }).addTo(map);
    const layer = L.layerGroup().addTo(map);

    let mode = 'price';
    function draw() {
        layer.clearLayers();
        for (const c of cities) {
            const label = mode === 'price' ? c.today_price.toFixed(1) : fmt.signed(c.change_7d);
            const color = mode === 'price' ? priceColor(c.today_price) : changeColor(c.change_7d);
            const icon = L.divIcon({ className: '', html: `<span class="price-pin" style="background:${color}">${label}</span>`, iconSize: null });
            L.marker([c.lat, c.lon], { icon, title: c.name }).addTo(layer).bindPopup(`
                <strong>${esc(c.name)}</strong>, ${esc(c.province)}<br>
                ${tr('Today', "Aujourd'hui")}: ${c.today_price.toFixed(1)} ¢/L<br>
                ${tr('In 7 days', 'Dans 7 jours')}: ${fmt.signed(c.change_7d)} ¢/L (${tr('chance higher', 'prob. de hausse')} ${fmt.pct(c.prob_up_7)})<br>
                ${c.regulated ? `<span class="muted">${tr('Regulated weekly maximum price', 'Prix maximum réglementé chaque semaine')}</span><br>` : ''}
                <a href="${link('index.html', { city: c.slug })}">${tr('Full forecast →', 'Prévision complète →')}</a>`);
        }
        const swatches = mode === 'price'
            ? [['#2a8a5a', tr('Cheapest 20%', '20 % moins chers')], ['#a8a8a8', tr('Middle', 'Milieu')], ['#d0603a', tr('Priciest 20%', '20 % plus chers')]]
            : [['#2a8a5a', tr('Falling 2¢+', 'Baisse de 2¢+')], ['#a8a8a8', tr('About flat', 'Stable')], ['#d0603a', tr('Rising 2¢+', 'Hausse de 2¢+')]];
        document.getElementById('legend').innerHTML = swatches.map(([c, t]) => `<span><span class="legend-swatch" style="background:${c}"></span>${t}</span>`).join('');
    }
    document.getElementById('mode').addEventListener('click', e => {
        const b = e.target.closest('button');
        if (!b) return;
        mode = b.dataset.m;
        document.querySelectorAll('#mode button').forEach(x => x.classList.toggle('active', x === b));
        draw();
    });
    draw();
    map.fitBounds(cities.map(c => [c.lat, c.lon]), { padding: [20, 20] });
    document.getElementById('count').textContent = tr(`Data up to ${fmt.date(cities[0].data_end)}`, `Données jusqu'au ${fmt.date(cities[0].data_end)}`);

    // Sortable table
    const table = document.getElementById('table');
    let sortKey = 'today_price', asc = true;
    const cols = [
        ['name', tr('City', 'Ville'), c => `<a href="${link('index.html', { city: c.slug })}">${esc(c.name)}</a>`],
        ['province', tr('Prov.', 'Prov.'), c => c.province],
        ['today_price', tr('Today', "Auj."), c => c.today_price.toFixed(1)],
        ['change_7d', tr('7-day move', 'Var. 7 j'), c => fmt.signed(c.change_7d)],
        ['prob_up_7', tr('Chance higher', 'Prob. hausse'), c => fmt.pct(c.prob_up_7)],
    ];
    function renderTable() {
        const rows = [...cities].sort((a, b) => {
            const x = a[sortKey], y = b[sortKey];
            return (typeof x === 'string' ? x.localeCompare(y, 'fr') : x - y) * (asc ? 1 : -1);
        });
        table.innerHTML = `<thead><tr>${cols.map(([k, t]) => `<th class="${k === 'name' || k === 'province' ? '' : 'num'}" data-k="${k}" style="cursor:pointer">${t}${k === sortKey ? (asc ? ' ↑' : ' ↓') : ''}</th>`).join('')}</tr></thead>
            <tbody>${rows.map(c => `<tr>${cols.map(([k, , f]) => `<td class="${k === 'name' || k === 'province' ? '' : 'num'}">${f(c)}</td>`).join('')}</tr>`).join('')}</tbody>`;
    }
    table.addEventListener('click', e => {
        const th = e.target.closest('th');
        if (!th) return;
        asc = th.dataset.k === sortKey ? !asc : true;
        sortKey = th.dataset.k;
        renderTable();
    });
    renderTable();
})();
</script>
</body>
</html>
